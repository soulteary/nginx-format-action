name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Check JavaScript
        run: bun run check

      - name: Run unit tests
        run: bun test

      - name: Prepare write-mode fixture
        run: |
          mkdir -p test/work
          cp test/fixtures/unformatted/nginx.conf test/work/nginx.conf

      - name: Format write-mode fixture
        id: write
        uses: ./
        with:
          path: test/work/nginx.conf
          mode: write

      - name: Verify write-mode result
        env:
          CHANGED: ${{ steps.write.outputs.changed }}
        run: |
          test "$CHANGED" = "true"
          test -s test/work/nginx.conf

      - name: Check write-mode result is stable
        id: stable
        uses: ./
        with:
          path: test/work/nginx.conf
          mode: check

      - name: Verify stable check result
        env:
          CHANGED: ${{ steps.stable.outputs.changed }}
        run: test "$CHANGED" = "false"
