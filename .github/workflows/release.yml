name: Release

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "action.yml"
      - "package.json"
      - "src/**"
      - "dist/**"
      - "test/**"
  workflow_dispatch:
    inputs:
      tag:
        description: Full release tag to validate and publish, for example v1.0.0.
        required: true
        type: string
      adopt-existing-release:
        description: Add the commit marker to an existing unmarked Release after verifying its tag.
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  ALLOW_RELEASE_ADOPTION: ${{ (github.event_name == 'push' && github.event.created) || (github.event_name == 'workflow_dispatch' && inputs.adopt-existing-release) }}

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Validate package version
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(bun -e 'process.stdout.write(require("./package.json").version)')"
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version $package_version is not a stable semantic version" >&2
            exit 1
          fi

          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

      - name: Validate release tag
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          expected_tag="v${PACKAGE_VERSION}"

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $RELEASE_TAG is not a stable semantic version" >&2
            exit 1
          fi

          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Tag $RELEASE_TAG does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi

          release_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "Release commit $release_commit is not part of main" >&2
            exit 1
          fi

      - name: Check JavaScript
        run: bun run check

      - name: Run unit tests
        run: bun test

      - name: Prepare integration fixture
        run: |
          mkdir -p test/work
          cp test/fixtures/unformatted/nginx.conf test/work/nginx.conf

      - name: Run released action in write mode
        id: write
        uses: ./
        with:
          path: test/work/nginx.conf
          mode: write

      - name: Verify write result
        env:
          CHANGED: ${{ steps.write.outputs.changed }}
          FORMATTER_VERSION: ${{ steps.write.outputs.formatter-version }}
        run: |
          test "$CHANGED" = "true"
          test "$FORMATTER_VERSION" = "v2.3.0"
          test -s test/work/nginx.conf

      - name: Verify formatted result is stable
        uses: ./
        with:
          path: test/work/nginx.conf
          mode: check

  publish:
    name: Publish release
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          release_marker="<!-- nginx-format-action-release-commit:$release_commit -->"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            release_body="$(gh release view "$RELEASE_TAG" --json body --jq '.body')"
            if grep -Fqx -- "$release_marker" <<< "$release_body"; then
              echo "Release $RELEASE_TAG already exists for $release_commit; leaving it unchanged."
            elif grep -Fq -- '<!-- nginx-format-action-release-commit:' <<< "$release_body"; then
              echo "Release $RELEASE_TAG records a different commit." >&2
              echo "Refusing to reuse a moved full-version tag." >&2
              exit 1
            elif [[ "$ALLOW_RELEASE_ADOPTION" == "true" ]]; then
              printf '%s\n\n%s\n' "$release_marker" "$release_body" \
                | gh release edit "$RELEASE_TAG" --notes-file -
              echo "Adopted existing Release $RELEASE_TAG for $release_commit."
            else
              echo "Release $RELEASE_TAG does not record the current tag commit $release_commit" >&2
              echo "Refusing to reuse an unmarked externally created full-version tag." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --generate-notes \
              --notes "$release_marker" \
              --title "Nginx Format Action $RELEASE_TAG"
          fi

      - name: Update major and minor version tags
        shell: bash
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          major_tag="v${version%%.*}"
          minor_tag="v${version%.*}"
          release_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          git push --force origin \
            "$release_commit:refs/tags/$major_tag" \
            "$release_commit:refs/tags/$minor_tag"
          echo "Updated $major_tag and $minor_tag to $release_commit"
